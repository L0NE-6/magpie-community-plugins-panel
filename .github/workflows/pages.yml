name: pages

on:
  push:
    branches: [panel]
    paths:
      - "panel/**"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "27 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'L0NE-6/magpie-community-plugins-panel'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: panel
      - id: deployment
        uses: actions/deploy-pages@v5
